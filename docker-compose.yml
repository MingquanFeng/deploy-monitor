services:
  deploy-monitor:
    build: .
    image: deploy-monitor:latest
    container_name: deploy-monitor
    ports:
      - "3000:3000"
    environment:
      # 从同目录 .env 读取（未设置时为空，webhook 端点会拒绝接入）
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-}
      DATA_DIR: /app/data
      # Server酱 微信推送，未配置时通知功能静默关闭，不影响其他功能
      SERVERCHAN_KEY: ${SERVERCHAN_KEY:-}
    volumes:
      # 命名卷持久化 SQLite 文件，容器重建数据不丢
      - deploy-monitor-data:/app/data
    # node:22-alpine 自带 /usr/bin/wget（busybox），无 curl，故不额外装包保持镜像精简。
    # -q -O- 丢弃响应体只看退出码；/api/health 在数据库不可用时返回 503，
    # wget 对非 2xx/3xx 返回非 0，容器随之标记 unhealthy。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3000/api/health"]
      # 探活频率：30s 足够及时，又不给 SQLite 增加无谓负载
      interval: 30s
      timeout: 5s
      # 连续 3 次失败（约 90s）才判定不健康，避开单次 GC/瞬时抖动造成的误报
      retries: 3
      # Next.js standalone 冷启动需要时间，
      # 该窗口内的失败不计入 retries，也不会把容器标成 unhealthy
      start_period: 20s
    restart: unless-stopped

volumes:
  deploy-monitor-data:
